<!DOCTYPE html>
<html>
<head>
<style>
:root { 
    --et-blue: #003366; 
    --et-light-blue: #e6f0fa; 
}
body { 
    font-family: 'Segoe UI', sans-serif; 
    padding: 20px; 
    background-color: #f4f7f9; 
}
.header { 
    display: flex; 
    align-items: center; 
    margin-bottom: 30px; 
    border-bottom: 3px solid var(--et-blue); 
}
.logo-placeholder { 
    font-size: 24px; 
    font-weight: bold; 
    color: var(--et-blue); 
    margin-right: 20px; 
}
table { 
    width: 100%; 
    border-collapse: collapse; 
    background: white; 
    box-shadow: 0 2px 5px rgba(0,0,0,0.1); 
    border-radius: 8px; 
    overflow: hidden; 
    margin-bottom: 40px; 
}
th { 
    background-color: var(--et-blue); 
    color: white; 
    padding: 12px; 
    font-size: 13px; 
}
td { 
    border: 1px solid #ddd; 
    padding: 10px; 
    text-align: center; 
}
input { 
    width: 65px; 
    padding: 5px; 
    border: 1px solid #ccc; 
    border-radius: 4px; 
    text-align: center; 
}
.reset-btn { 
    background-color: #d9534f; 
    color: white; 
    border: none; 
    padding: 5px 15px; 
    border-radius: 4px; 
    cursor: pointer; 
}
.split-box { 
    display: none; 
    margin-top: 8px; 
    padding: 8px; 
    border: 1px dashed var(--et-blue); 
    background: #fdfdfd; 
    font-size: 12px; 
}
.split-box.visible { 
    display: block; 
}
button { 
    cursor: pointer; 
    padding: 5px; 
    background: var(--et-blue); 
    color: white; 
    border: none; 
    border-radius: 4px; 
}
</style>
</head>
<body>
<div class="header">
    <div class="logo-placeholder">ENERGY TRANSFER</div>
    <h2>Terminal Operations Calculator</h2>
</div>

<div id="calculator-container"></div>

<script>
function toMins(timeStr) {
    const [h, m] = timeStr.split(':').map(Number);
    return (h * 60) + m;
}

function toStr(totalMins) {
    const h = Math.floor(totalMins / 60) % 24;
    const m = Math.round(totalMins % 60);
    return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
}

function getPrevRemaining(row) {
    const prevRow = row.previousElementSibling;
    if (prevRow && prevRow.querySelector('.st')) {
        const prevRemainText = prevRow.querySelector('.rem').innerText;
        return prevRemainText !== '-' ? parseFloat(prevRemainText) : 0;
    }
    return 0;
}

function getPrevRate2(row) {
    const prevRow = row.previousElementSibling;
    if (prevRow && prevRow.querySelector('.st')) {
        const prevR2 = parseFloat(prevRow.querySelector('.r2').value) || 0;
        return prevR2;
    }
    return 0;
}

function calculateRow(el) {
    const row = el.closest('tr');
    const st = row.querySelector('.st').value;
    const r1 = parseFloat(row.querySelector('.r1').value) || 0;
    const totalGoal = parseFloat(row.querySelector('.goal').value) || 0;
    const isSplit = row.querySelector('.split-box').classList.contains('visible');
    
    if (st.includes(':')) {
        let finalEndStr = "";
        let currentSplitTimeStr = ""; 
        
        if (!isSplit) {
            // Normal Mode
            const dur = (r1 > 0) ? (totalGoal / r1) : 0;
            finalEndStr = toStr(toMins(st) + (dur * 60));
            row.querySelector('.et').innerText = finalEndStr;
            row.querySelector('.rem').innerText = '-';
        } else {
            // Split Mode
            currentSplitTimeStr = row.querySelector('.split-time').value;
            const r2 = parseFloat(row.querySelector('.r2').value) || 0;
            
            if (currentSplitTimeStr.includes(':')) {
                const startMins = toMins(st);
                const splitMins = toMins(currentSplitTimeStr);
                const elapsedMins = splitMins - startMins;
                
                const prevRemaining = getPrevRemaining(row);
                const actualTotal = prevRemaining > 0 ? prevRemaining : totalGoal;
                const prevRate2 = getPrevRate2(row);
                const actualRate = prevRemaining > 0 ? prevRate2 : r1;
                
                const batchDone = (elapsedMins / 60) * actualRate;
                const batchRem = actualTotal - batchDone;
                row.querySelector('.rem').innerText = batchRem.toFixed(2);
                
                const dur2 = (r2 > 0) ? (batchRem / r2) : 0;
                finalEndStr = toStr(splitMins + (dur2 * 60));
                row.querySelector('.et').innerText = finalEndStr;
            }
        }
        
        const nextRow = row.nextElementSibling;
        if (nextRow && nextRow.querySelector('.st')) {
            const nextIsSplit = nextRow.querySelector('.split-box').classList.contains('visible');
            let timeToPass = "";
            
            // Determine which time to pass based on the NEXT row's split status
            if (!isSplit) {
                // If current row is NOT split, always pass End Time
                timeToPass = finalEndStr;
            } else {
                // If current row IS split, check the next row
                if (nextIsSplit) {
                    timeToPass = currentSplitTimeStr; // Next row is split -> pass Split Time
                } else {
                    timeToPass = finalEndStr; // Next row is NOT split -> pass End Time
                }
            }
            
            if (timeToPass !== "") {
                nextRow.querySelector('.st').value = timeToPass;
            }
            
            // Carry the appropriate rate down
            if (isSplit) {
                const currentR2 = row.querySelector('.r2').value;
                if (currentR2) {
                    nextRow.querySelector('.r1').value = currentR2;
                } else {
                    nextRow.querySelector('.r1').value = "";
                }
            } else {
                const currentR1 = row.querySelector('.r1').value;
                if (currentR1) {
                    nextRow.querySelector('.r1').value = currentR1;
                } else {
                    nextRow.querySelector('.r1').value = "";
                }
            }
            
            calculateRow(nextRow.querySelector('.st'));
        }
    }
}

function toggleSplit(btn) {
    const row = btn.closest('tr');
    const box = row.querySelector('.split-box');
    box.classList.toggle('visible');
    btn.innerText = box.classList.contains('visible') ? "Remove Split" : "Split Rate";
    
    if (!box.classList.contains('visible')) {
        // When split is removed, clear the Remain BBL
        row.querySelector('.rem').innerText = '-';
    }
    
    // Trigger calculation from the previous row so it pushes the newly correct Start Time down
    const prevRow = row.previousElementSibling;
    if (prevRow && prevRow.querySelector('.st') && prevRow.querySelector('.st').value !== "") {
        calculateRow(prevRow.querySelector('.st'));
    } else {
        calculateRow(btn);
    }
}

function resetTable(btn) {
    const container = btn.parentElement.nextElementSibling;
    container.querySelectorAll('input').forEach(i => i.value = '');
    container.querySelectorAll('.et').forEach(c => c.innerText = '-');
    container.querySelectorAll('.rem').forEach(c => c.innerText = '-');
}

const container = document.getElementById('calculator-container');
['FOST', 'MGD1', 'MGD2', 'MGDR3'].forEach(term => {
    container.innerHTML += `
    <div style="display:flex; justify-content:space-between; align-items:center;">
        <h3>${term} Terminal</h3>
        <button class="reset-btn" onclick="resetTable(this)">Reset Table</button>
    </div>
    <table>
        <tr>
            <th>Start</th>
            <th>Rate 1 (Bph)</th>
            <th>Total Bbl</th>
            <th>End</th>
            <th>Options</th>
            <th>Remain Bbl</th>
        </tr>
        ${Array.from({length: 10}, () => `<tr>
            <td><input type="text" class="st" oninput="calculateRow(this)" placeholder="HH:MM"></td>
            <td><input type="number" class="r1" oninput="calculateRow(this)" placeholder="R1"></td>
            <td><input type="number" class="goal" oninput="calculateRow(this)" placeholder="Total"></td>
            <td class="et">-</td>
            <td>
                <button onclick="toggleSplit(this)">Split Rate</button>
                <div class="split-box">
                    Split Time: <input type="text" class="split-time" oninput="calculateRow(this)" placeholder="HH:MM"><br>
                    Rate 2: <input type="number" class="r2" oninput="calculateRow(this)" placeholder="R2">
                </div>
            </td>
            <td class="rem">-</td>
        </tr>`).join('')}
    </table>`;
});
</script>
</body>
</html>
